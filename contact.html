<body class="font-dm">

<!-- ============ HEADER ============
     Same header as the home page: "MSA" left, "Menu" right, hides on
     scroll-down and returns on scroll-up. -->
<header class="site-header" id="header">
  <a class="logo" href="index.html" aria-label="Back to home">MSA</a>
  <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu">
    <span class="menu-toggle-label" data-text="Menu">Menu</span>
  </button>
</header>

<!-- ============ MENU OVERLAY ============ -->
<div class="menu" id="menu" hidden>
  <div class="menu-inner">
    <nav class="menu-list" aria-label="Main">
      <a class="menu-item" href="index.html"><span data-i18n="menu.home">Home</span></a>
      <a class="menu-item" href="project.html"><span data-i18n="menu.project">Project</span></a>
      <a class="menu-item" href="contact.html"><span data-i18n="menu.contact">Contact</span></a>
    </nav>
    <div class="menu-lang" aria-label="Language">
      <button class="lang is-active" type="button" data-lang="id">ID</button>
      <span class="lang-sep">|</span>
      <button class="lang" type="button" data-lang="en">EN</button>
    </div>
  </div>
</div>

<!-- ============ HERO ============
     The original centres one line of text in the viewport and drives it with
     a WebGL SDF shader (uReveal / uDelta follow the pointer). Here the same
     behaviour is reproduced with layered DOM: a blurred, clipped duplicate of
     the text tracks the pointer to give the soft-edged reveal, while the
     crisp layer stays put. On coarse pointers it degrades to plain centred
     text, exactly as the original does on mobile. -->
<section class="contact-stage" id="contactStage">
  <div class="contact-headline" id="contactHeadline">
    <span class="contact-glow" aria-hidden="true" data-i18n="contact.headline">Drop me a message !</span>
    <span class="contact-text" data-i18n="contact.headline">Drop me a message !</span>
  </div>
  <p class="sr-only" id="contactSr" aria-live="polite" data-i18n="contact.headlineSr">Drop me a message!</p>
</section>

<!-- ============ CONTACT LINKS ============
     Each link is a two-row stack: the label sits in row 1 and the real
     destination (email address / handle) in row 2. Hovering slides row 1 up
     and row 2 into place, the way the original does with a 24px offset.
     Mail copies the address to the clipboard rather than opening a client. -->
<footer class="contact-bar" id="contactBar">

  <div class="c-link" data-anchor="left">
    <span class="c-link-ghost" aria-hidden="true">muhammadsyahril2406@gmail.com</span>

    <span class="c-link-row c-link-row-b" aria-hidden="true">muhammadsyahril2406@gmail.com</span>

    <span class="c-link-row c-link-row-b" aria-hidden="true">Muhammad Syahril Alauddin</span>
  </div>

  <div class="c-link" data-anchor="center">
    <span class="c-link-ghost" aria-hidden="true">@_syaarill06</span>
