<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skills — Muhammad Syahril</title>
<meta name="description" content="The languages, frameworks, and tools Muhammad Syahril works with — Python, Java, C, JavaScript, Go, PHP, Laravel, MySQL, and computer vision." />
<link rel="stylesheet" href="style.css" />
</head>
<body class="font-dm sk-page">

<div class="scroll-progress" aria-hidden="true"></div>

<!-- ============ HEADER ============ -->
<header class="site-header" id="header">
  <a class="logo" href="index.html" aria-label="Back to home">MSA</a>
  <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu">
    <span class="menu-toggle-label" data-text="Menu">Menu</span>
  </button>
</header>

<!-- ============ MENU OVERLAY ============ -->
<div class="menu" id="menu" hidden>
  <div class="menu-inner">
    <nav class="menu-list" aria-label="Main">
      <a class="menu-item" href="index.html"><span data-i18n="menu.home">Home</span></a>
      <a class="menu-item" href="project.html"><span data-i18n="menu.project">Project</span></a>
      <a class="menu-item" href="contact.html"><span data-i18n="menu.contact">Contact</span></a>
    </nav>
    <div class="menu-lang" aria-label="Language">
      <button class="lang is-active" type="button" data-lang="id">ID</button>
      <span class="lang-sep">|</span>
      <button class="lang" type="button" data-lang="en">EN</button>
    </div>
  </div>
</div>

<main class="sk-main" id="skMain">

  <h1 class="sk-title" data-i18n="skills.title">Skills</h1>
  <p class="sk-sub" data-i18n="skills.sub">
    The languages and tools I reach for. Hover the orbits to slow them down,
    or read the list below.
  </p>

  <!-- ============ ORBIT STAGE ============
       Two rings (inner cyan, outer purple) with the skill icons circling
       them. Every position is written by script.js as --sk-cos / --sk-sin,
       so the markup stays static and the compositor animates it. -->
  <div class="sk-stage" id="skStage" role="img"
       aria-label="Skill icons orbiting. Inner ring: JavaScript, Python, C, Java, PHP, HTML and CSS. Outer ring: Vue, TypeScript, React Native, Node.js, Go, MySQL and Computer Vision.">

    <div class="sk-core" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="skGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4" />
            <stop offset="100%" stop-color="#9333EA" />
          </linearGradient>
        </defs>
        <polyline points="16 18 22 12 16 6" stroke="url(#skGrad)" />
        <polyline points="8 6 2 12 8 18" stroke="url(#skGrad)" />
      </svg>
    </div>

    <!-- rings -->
    <div class="sk-ring" data-ring="inner" aria-hidden="true"
         style="--sk-glow-1:rgba(6,182,212,.40);--sk-glow-2:rgba(6,182,212,.20);--sk-edge:rgba(6,182,212,.30);"></div>
    <div class="sk-ring" data-ring="outer" aria-hidden="true"
         style="--sk-glow-1:rgba(147,51,234,.40);--sk-glow-2:rgba(147,51,234,.20);--sk-edge:rgba(147,51,234,.30);--sk-delay:1.5s;"></div>

    <!-- icons are injected by script.js from the SKILLS list -->
  </div>

  <!-- ============ THE SAME SKILLS, READABLE ============ -->
  <div class="sk-list" id="skList" role="list"><!-- injected --></div>

</main>

<footer class="sk-footer">
  <a class="footer-note" href="index.html" data-i18n="footer.back">Back to projects</a>
  <a class="footer-contact" href="contact.html" data-i18n="footer.contact">Contact</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="script.js"></script>
</body>
</html>
